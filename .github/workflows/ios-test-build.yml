name: iOS test build

# Builds unsigned .ipa files for SeamShift and Balance Stack.
# They are signed on the tester's own Mac with Sideloadly and a free Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['seamshift/**', 'balance/**', '.github/workflows/ios-test-build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build both apps
        run: |
          set -euo pipefail
          for app in seamshift:SeamShift balance:BalanceStack; do
            dir=${app%%:*}; name=${app##*:}
            pushd "$dir"
            npm ci
            npx cap sync ios
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            rm -rf Payload && mkdir Payload
            cp -R build/Build/Products/Release-iphoneos/App.app Payload/
            zip -qr "../$name.ipa" Payload
            popd
          done
          ls -la *.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" SeamShift.ipa BalanceStack.ipa \
            --title "Testversie ${{ github.run_number }}" \
            --notes "Zet deze bestanden met Sideloadly op je iPhone."
