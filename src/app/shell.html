<style>
/* App shell: a home screen, a play screen and bottom sheets. One game per app; the screens fill the phone without page scroll.
   Look: warm paper background, white cards that sit slightly raised, pressable buttons with a solid bottom edge. */
:root {
  color-scheme: light;
  --bg: #f4efe7; --bg-hi: #fbf8f3; --card: #ffffff; --edge: #e4dccf; --line: #ebe4d9;
  --ink: #2b2540; --muted: #8a8299; --gold: #f2a01c; --danger: #e5533f;
  --accent: __ACCENT__; --accent-deep: __ACCENT_DEEP__; --accent-soft: __ACCENT_SOFT__;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --lift: 0 4px 0 var(--edge), 0 14px 28px -18px rgba(70, 50, 30, .45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(130% 80% at 50% 0%, var(--bg-hi) 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink); font-family: var(--body); font-weight: 700; overscroll-behavior: none; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--st) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sb) + 16px) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .25s ease, transform .25s ease;
}
.screen[hidden] { display: flex; opacity: 0; pointer-events: none; transform: scale(.985); }
.col { width: min(100%, 440px); display: flex; flex-direction: column; }

/* buttons: a solid bottom edge that disappears when pressed */
button {
  font: 800 16px var(--body); color: var(--ink); background: var(--card); border: 0;
  border-radius: 18px; padding: 14px 18px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  box-shadow: var(--lift); transition: transform .08s ease, box-shadow .08s ease;
}
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge), 0 6px 14px -12px rgba(70, 50, 30, .45); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .5; }
.go {
  background: var(--accent); color: #fff; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .01em;
  padding: 17px 26px; box-shadow: 0 5px 0 var(--accent-deep), 0 16px 28px -14px var(--accent);
}
.go:active:not(:disabled) { box-shadow: 0 2px 0 var(--accent-deep), 0 8px 16px -12px var(--accent); }
.icon-btn { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; flex: none; border-radius: 15px; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* home */
#home .col { flex: 1; justify-content: space-between; gap: 16px; }
.home-top { display: flex; justify-content: space-between; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo-wrap { position: relative; width: min(48vw, 200px); aspect-ratio: 1; margin-bottom: 6px; }
#logo { width: 100%; height: 100%; border-radius: 24%; box-shadow: 0 8px 0 var(--edge), 0 26px 44px -20px rgba(70, 50, 30, .55); }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 11vw, 48px); letter-spacing: -0.01em; margin: 0; line-height: 1; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; font-weight: 700; max-width: 28ch; line-height: 1.4; }
.menu { display: grid; gap: 12px; }
.menu button { width: 100%; }
.daily { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 14px 16px; }
.daily .lbl { display: flex; align-items: center; gap: 12px; font-size: 17px; }
.daily .cal { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent-deep); font: 600 15px var(--display); }
.daily small { font: 700 13px var(--body); color: var(--muted); }
.records { display: flex; gap: 12px; }
.rec { flex: 1; background: var(--card); border-radius: 18px; padding: 10px 12px 12px; text-align: center; box-shadow: var(--lift); }
.rec span { display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
.rec b { font-family: var(--display); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }

/* play */
#play .col { flex: 1; gap: 10px; align-items: stretch; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .mode { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .mode b { color: var(--accent-deep); }
.stats { display: flex; gap: 8px; }
.stat { background: var(--card); border-radius: 15px; padding: 5px 12px 6px; min-width: 72px; text-align: center; box-shadow: var(--lift); }
.stat b { display: block; font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 800; color: var(--muted); }
.info { min-height: 30px; display: flex; justify-content: center; }
.info span { background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.info span:empty { display: none; }
.well { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.stage { position: relative; width: min(100%, 440px); aspect-ratio: 1; touch-action: none; }
canvas#cv { width: 100%; height: 100%; display: block; border-radius: 26px; box-shadow: 0 6px 0 var(--edge), 0 24px 40px -22px rgba(70, 50, 30, .5); }
.coach {
  pointer-events: none; background: var(--card); color: var(--ink); border-radius: 16px; padding: 11px 16px;
  font-size: 16px; font-weight: 800; line-height: 1.35; text-align: center; box-shadow: var(--lift);
  border-left: 5px solid var(--accent); transition: opacity .3s ease, transform .3s ease;
}
.coach[hidden] { display: none; }
.overlay {
  position: absolute; inset: 0; z-index: 3; border-radius: 26px; display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(244, 239, 231, .7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fadeIn .25s ease;
}
.overlay[hidden] { display: none; }
.over-card {
  width: 100%; max-width: 320px; background: var(--card); border-radius: 26px; padding: 22px 20px 20px; text-align: center;
  display: grid; gap: 10px; box-shadow: 0 6px 0 var(--edge), 0 30px 50px -26px rgba(70, 50, 30, .6); animation: popIn .35s cubic-bezier(.2, 1.4, .4, 1);
}
.over-card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; color: var(--muted); }
.over-card h2.new { color: var(--gold); }
.over-card .big { font-family: var(--display); font-weight: 700; font-size: clamp(52px, 16vw, 68px); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.over-card p { margin: 0 auto 4px; color: var(--muted); font-size: 15px; max-width: 26ch; line-height: 1.4; }
.over-card .row { display: grid; gap: 10px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.94); } }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.foot .ctl { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; flex: 1; line-height: 1.3; }

/* bottom sheets */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(43, 37, 64, .28); display: flex; align-items: flex-end; justify-content: center; transition: opacity .2s ease; }
.sheet-bg[hidden] { display: flex; opacity: 0; pointer-events: none; }
.sheet {
  width: min(100%, 480px); max-height: 88vh; max-height: 88dvh; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 10px 18px calc(var(--sb) + 20px); display: grid; gap: 14px; align-content: start;
  transition: transform .28s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 40px -20px rgba(43, 37, 64, .5);
}
.sheet::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--edge); }
.sheet-bg[hidden] .sheet { transform: translateY(40px); }
.sheet h3 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; }
.sheet h4 { margin: 6px 4px 0; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.group { background: var(--card); border-radius: 20px; box-shadow: var(--lift); overflow: hidden; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 17px; }
.toggle + .toggle { border-top: 2px solid var(--line); }
.switch { width: 54px; height: 32px; padding: 0; border-radius: 999px; position: relative; background: var(--edge); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .08); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .18); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.switch:active:not(:disabled) { transform: none; }
.link-row { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 17px; }
.link-row svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rules { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: rule; }
.rules li { background: var(--card); border-radius: 20px; padding: 14px 16px 14px 62px; position: relative; box-shadow: var(--lift); min-height: 64px; }
.rules li::before {
  counter-increment: rule; content: counter(rule); position: absolute; left: 14px; top: 14px; width: 34px; height: 34px; border-radius: 11px;
  display: grid; place-items: center; font: 600 18px var(--display); color: #fff; background: var(--accent); box-shadow: 0 3px 0 var(--accent-deep);
}
.rules b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; margin-bottom: 2px; }
.rules span { display: block; font-weight: 700; font-size: 15px; line-height: 1.4; color: var(--muted); }
.sheet .small { font-size: 13px; color: var(--muted); margin: 0 4px; text-align: center; }
.daily-res { text-align: center; }
.daily-res .small { font-size: 15px; }
.ds-score { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
[hidden]#restartBtn { visibility: hidden; display: grid; }

/* levels: goal chips, moves counter, stars, the level grid */
button.rec { padding: 10px 12px 12px; border-radius: 18px; font: inherit; }
.rec b span { display: inline; font-size: inherit; color: inherit; }
.rec b .st { color: var(--gold); margin-right: 4px; }
.free { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; font-size: 16px; }
.free small { font: 700 13px var(--body); color: var(--muted); }
.stat[hidden] { display: none; }
#movesStat { background: var(--accent); box-shadow: 0 4px 0 var(--accent-deep), 0 14px 28px -18px var(--accent); }
#movesStat span { color: rgba(255, 255, 255, .8); }
#movesStat b { color: #fff; }
#movesStat.low { background: var(--danger); box-shadow: 0 4px 0 #b73a29; }
.stat.low b { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.goals { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.goals[hidden] { display: none; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 18px; padding: 5px 14px 5px 7px; box-shadow: var(--lift); }
.chip canvas { width: 42px; height: 42px; }
.chip b:empty { display: none; }
.chip:has(b:empty) { padding-right: 7px; }
.chip b { font-family: var(--display); font-weight: 600; font-size: 24px; min-width: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }
.chip.done { background: #e3f6ec; }
.chip.done b { color: #1f9e68; }
.bump { animation: bump .32s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 40% { transform: scale(1.18); } }
.fly { position: fixed; z-index: 30; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(40, 30, 60, .3); transition: transform .48s cubic-bezier(.5, -0.3, .7, .6), opacity .48s ease; }
.stars { display: flex; justify-content: center; gap: 6px; margin: -4px 0 2px; }
.stars[hidden] { display: none; }
.stars svg { width: 54px; height: 54px; fill: var(--edge); stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; }
.stars svg:nth-child(2) { width: 66px; height: 66px; margin-top: -10px; }
.stars svg.on { fill: var(--gold); animation: starIn .45s cubic-bezier(.2, 1.7, .4, 1); filter: drop-shadow(0 3px 4px rgba(201, 125, 10, .45)); }
@keyframes starIn { from { transform: scale(.2) rotate(-40deg); } }
.over-card .row2 { display: flex; gap: 10px; } .over-card .row2 button { flex: 1; }
.over-card [hidden] { display: none; }
.lv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.lv { padding: 10px 0 8px; display: grid; gap: 2px; justify-items: center; border-radius: 16px; }
.lv b { font: 600 22px var(--display); }
.lv i { font-style: normal; font-size: 13px; color: var(--gold); letter-spacing: 1px; height: 16px; }
.lv i em { font-style: normal; color: var(--edge); }
.lv.next { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-deep); }
.lv.next i em { color: rgba(255, 255, 255, .45); }
.lv.locked { opacity: .45; }
@media (prefers-reduced-motion: reduce) { .screen, .sheet, .coach, .sheet-bg, button { transition: none; } .overlay, .over-card { animation: none; } }
</style>

<script>
