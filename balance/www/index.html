<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Balance Stack</title>
<meta name="theme-color" content="#f4efe7">
<link rel="stylesheet" href="fonts.css">
<style>
/* App shell: a home screen, a play screen and bottom sheets. One game per app; the screens fill the phone without page scroll.
   Look: warm paper background, white cards that sit slightly raised, pressable buttons with a solid bottom edge. */
:root {
  color-scheme: light;
  --bg: #f4efe7; --bg-hi: #fbf8f3; --card: #ffffff; --edge: #e4dccf; --line: #ebe4d9;
  --ink: #2b2540; --muted: #8a8299; --gold: #f2a01c; --danger: #e5533f;
  --accent: #8b5cf6; --accent-deep: #6438cf; --accent-soft: #ebe4fd;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --lift: 0 4px 0 var(--edge), 0 14px 28px -18px rgba(70, 50, 30, .45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(130% 80% at 50% 0%, var(--bg-hi) 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink); font-family: var(--body); font-weight: 700; overscroll-behavior: none; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--st) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sb) + 16px) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .25s ease, transform .25s ease;
}
.screen[hidden] { display: flex; opacity: 0; pointer-events: none; transform: scale(.985); }
.col { width: min(100%, 440px); display: flex; flex-direction: column; }

/* buttons: a solid bottom edge that disappears when pressed */
button {
  font: 800 16px var(--body); color: var(--ink); background: var(--card); border: 0;
  border-radius: 18px; padding: 14px 18px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
  box-shadow: var(--lift); transition: transform .08s ease, box-shadow .08s ease;
}
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge), 0 6px 14px -12px rgba(70, 50, 30, .45); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .5; }
.go {
  background: var(--accent); color: #fff; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .01em;
  padding: 17px 26px; box-shadow: 0 5px 0 var(--accent-deep), 0 16px 28px -14px var(--accent);
}
.go:active:not(:disabled) { box-shadow: 0 2px 0 var(--accent-deep), 0 8px 16px -12px var(--accent); }
.icon-btn { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; flex: none; border-radius: 15px; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* home */
#home .col { flex: 1; justify-content: space-between; gap: 16px; }
.home-top { display: flex; justify-content: space-between; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo-wrap { position: relative; width: min(48vw, 200px); aspect-ratio: 1; margin-bottom: 6px; }
#logo { width: 100%; height: 100%; border-radius: 24%; box-shadow: 0 8px 0 var(--edge), 0 26px 44px -20px rgba(70, 50, 30, .55); }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 11vw, 48px); letter-spacing: -0.01em; margin: 0; line-height: 1; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; font-weight: 700; max-width: 28ch; line-height: 1.4; }
.menu { display: grid; gap: 12px; }
.menu button { width: 100%; }
.daily { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 14px 16px; }
.daily .lbl { display: flex; align-items: center; gap: 12px; font-size: 17px; }
.daily .cal { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent-deep); font: 600 15px var(--display); }
.daily small { font: 700 13px var(--body); color: var(--muted); }
.records { display: flex; gap: 12px; }
.rec { flex: 1; background: var(--card); border-radius: 18px; padding: 10px 12px 12px; text-align: center; box-shadow: var(--lift); }
.rec span { display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
.rec b { font-family: var(--display); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }

/* play */
#play .col { flex: 1; gap: 10px; align-items: stretch; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .mode { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .mode b { color: var(--accent-deep); }
.stats { display: flex; gap: 8px; }
.stat { background: var(--card); border-radius: 15px; padding: 5px 12px 6px; min-width: 72px; text-align: center; box-shadow: var(--lift); }
.stat b { display: block; font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 800; color: var(--muted); }
.info { min-height: 30px; display: flex; justify-content: center; }
.info span { background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.info span:empty { display: none; }
.well { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.stage { position: relative; width: min(100%, 440px); aspect-ratio: 1; touch-action: none; }
canvas#cv { width: 100%; height: 100%; display: block; border-radius: 26px; box-shadow: 0 6px 0 var(--edge), 0 24px 40px -22px rgba(70, 50, 30, .5); }
.coach {
  pointer-events: none; background: var(--card); color: var(--ink); border-radius: 16px; padding: 11px 16px;
  font-size: 16px; font-weight: 800; line-height: 1.35; text-align: center; box-shadow: var(--lift);
  border-left: 5px solid var(--accent); transition: opacity .3s ease, transform .3s ease;
}
.coach[hidden] { display: none; }
.overlay {
  position: absolute; inset: 0; z-index: 3; border-radius: 26px; display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(244, 239, 231, .7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fadeIn .25s ease;
}
.overlay[hidden] { display: none; }
.over-card {
  width: 100%; max-width: 320px; background: var(--card); border-radius: 26px; padding: 22px 20px 20px; text-align: center;
  display: grid; gap: 10px; box-shadow: 0 6px 0 var(--edge), 0 30px 50px -26px rgba(70, 50, 30, .6); animation: popIn .35s cubic-bezier(.2, 1.4, .4, 1);
}
.over-card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; color: var(--muted); }
.over-card h2.new { color: var(--gold); }
.over-card .big { font-family: var(--display); font-weight: 700; font-size: clamp(52px, 16vw, 68px); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.over-card p { margin: 0 auto 4px; color: var(--muted); font-size: 15px; max-width: 26ch; line-height: 1.4; }
.over-card .row { display: grid; gap: 10px; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.94); } }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.foot .ctl { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; flex: 1; line-height: 1.3; }

/* bottom sheets */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(43, 37, 64, .28); display: flex; align-items: flex-end; justify-content: center; transition: opacity .2s ease; }
.sheet-bg[hidden] { display: flex; opacity: 0; pointer-events: none; }
.sheet {
  width: min(100%, 480px); max-height: 88vh; max-height: 88dvh; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 10px 18px calc(var(--sb) + 20px); display: grid; gap: 14px; align-content: start;
  transition: transform .28s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 40px -20px rgba(43, 37, 64, .5);
}
.sheet::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--edge); }
.sheet-bg[hidden] .sheet { transform: translateY(40px); }
.sheet h3 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; }
.sheet h4 { margin: 6px 4px 0; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.group { background: var(--card); border-radius: 20px; box-shadow: var(--lift); overflow: hidden; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 17px; }
.toggle + .toggle { border-top: 2px solid var(--line); }
.switch { width: 54px; height: 32px; padding: 0; border-radius: 999px; position: relative; background: var(--edge); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .08); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .18); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.switch:active:not(:disabled) { transform: none; }
.link-row { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 17px; }
.link-row svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rules { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: rule; }
.rules li { background: var(--card); border-radius: 20px; padding: 14px 16px 14px 62px; position: relative; box-shadow: var(--lift); min-height: 64px; }
.rules li::before {
  counter-increment: rule; content: counter(rule); position: absolute; left: 14px; top: 14px; width: 34px; height: 34px; border-radius: 11px;
  display: grid; place-items: center; font: 600 18px var(--display); color: #fff; background: var(--accent); box-shadow: 0 3px 0 var(--accent-deep);
}
.rules b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; margin-bottom: 2px; }
.rules span { display: block; font-weight: 700; font-size: 15px; line-height: 1.4; color: var(--muted); }
.sheet .small { font-size: 13px; color: var(--muted); margin: 0 4px; text-align: center; }
.daily-res { text-align: center; }
.daily-res .small { font-size: 15px; }
.ds-score { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
[hidden]#restartBtn { visibility: hidden; display: grid; }
@media (prefers-reduced-motion: reduce) { .screen, .sheet, .coach, .sheet-bg, button { transition: none; } .overlay, .over-card { animation: none; } }
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/><circle cx="12" cy="12" r="6.6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</svg>

<section class="screen" id="home">
  <div class="col">
    <div class="home-top">
      <button class="icon-btn" id="helpBtn" aria-label="Spelregels"><svg><use href="#i-help"/></svg></button>
      <button class="icon-btn" id="setBtn1" aria-label="Instellingen"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="hero">
      <div class="logo-wrap"><canvas id="logo" aria-hidden="true"></canvas></div>
      <h1 id="appName">Balance Stack</h1>
      <p id="appPitch"></p>
    </div>
    <div class="menu">
      <div class="records">
        <div class="rec"><span>Record</span><b id="homeBest">0</b></div>
        <div class="rec"><span>Dagpuzzel</span><b id="homeDaily">–</b></div>
      </div>
      <button class="go" id="playBtn">Spelen</button>
      <button class="daily" id="dailyBtn"><span class="lbl"><span class="cal" id="dailyDay"></span>Dagpuzzel</span><small id="dailyDate"></small></button>
    </div>
  </div>
</section>

<section class="screen" id="play" hidden>
  <div class="col">
    <div class="bar">
      <button class="icon-btn" id="homeBtn" aria-label="Naar start"><svg><use href="#i-back"/></svg></button>
      <div class="mode" id="mode"></div>
      <div class="stats">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Record</span><b id="best">0</b></div>
      </div>
    </div>
    <div class="info"><span id="info"></span></div>
    <div class="coach" id="coach" hidden></div>
    <div class="well" id="well">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Speelveld"></canvas>
        <div class="overlay" id="over" hidden>
          <div class="over-card">
            <h2 id="overTitle">Einde</h2>
            <div class="big" id="finalScore">0</div>
            <p id="overText"></p>
            <div class="row"><button class="go" id="againBtn">Nog een keer</button><button id="toHomeBtn">Naar start</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="icon-btn" id="restartBtn" aria-label="Opnieuw beginnen"><svg><use href="#i-redo"/></svg></button>
      <span class="ctl" id="ctl"></span>
      <button class="icon-btn" id="setBtn2" aria-label="Instellingen"><svg><use href="#i-gear"/></svg></button>
    </div>
  </div>
</section>

<div class="sheet-bg" id="dailySheet" hidden>
  <div class="sheet daily-res" role="dialog" aria-modal="true" aria-labelledby="dsTitle">
    <div class="sheet-head"><h3 id="dsTitle">Dagpuzzel</h3><button class="icon-btn" id="dsClose" aria-label="Sluiten"><svg><use href="#i-close"/></svg></button></div>
    <p class="small">Je hebt de dagpuzzel van vandaag gespeeld. Je score:</p>
    <div class="ds-score" id="dsScore">0</div>
    <p class="small" id="dsNext"></p>
    <button class="go" id="dsShare">Deel je score</button>
  </div>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-head"><h3 id="setTitle">Instellingen</h3><button class="icon-btn" id="closeSet" aria-label="Sluiten"><svg><use href="#i-close"/></svg></button></div>
    <div class="group">
      <div class="toggle"><span>Geluid</span><button class="switch" id="sndSw" role="switch" aria-checked="true" aria-label="Geluid"></button></div>
      <div class="toggle"><span>Trillen</span><button class="switch" id="vibSw" role="switch" aria-checked="true" aria-label="Trillen"></button></div>
    </div>
    <button class="link-row" id="rulesBtn">Spelregels<svg><use href="#i-next"/></svg></button>
    <button class="link-row" id="tutBtn">Uitleg opnieuw spelen<svg><use href="#i-next"/></svg></button>
    <p class="small">Je scores worden alleen op dit toestel bewaard.</p>
  </div>
</div>

<div class="sheet-bg" id="rulesSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <div class="sheet-head"><h3 id="rulesTitle">Zo speel je</h3><button class="icon-btn" id="closeRules" aria-label="Sluiten"><svg><use href="#i-close"/></svg></button></div>
    <ol class="rules" id="rules"></ol>
    <button class="go" id="rulesPlay">Spelen</button>
  </div>
</div>
<script>
// ---------- App framework: one game, home / play / settings, daily puzzle, first-play tutorial ----------
// iOS 15 Safari has no canvas roundRect yet
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.max(0, Math.min(+r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
const GAMES = [];
const LAB = (() => {
  const COLORS = ['#ef5b4c', '#f5a524', '#2dbf84', '#3b8cff', '#8b5cf6', '#ff6fa8'];
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), well = $('well');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let P = 'app';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(P + '_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(P + '_' + k, JSON.stringify(v)); } catch {} },
  };
  let W = 0, dpr = 1, cur = null, fx = [], shakeAmt = 0, score = 0, ended = false, playing = false;
  let soundOn = true, vibOn = true, daily = false, tut = null;

  // the board is the largest square that fits the space between the top bar and the buttons
  function resize() {
    const r = well.getBoundingClientRect(), s = Math.max(200, Math.floor(Math.min(r.width, r.height, 460)));
    stage.style.width = s + 'px'; stage.style.height = s + 'px';
    dpr = Math.min(devicePixelRatio || 1, 3); W = s; cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr);
  }
  new ResizeObserver(resize).observe(well);

  // seeded randomness so everyone gets the same daily puzzle
  let rng = Math.random;
  const seeded = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

  // sound
  let ac = null;
  function audio() { if (!soundOn) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state !== 'running') ac.resume(); } catch { ac = null; } return ac; }
  // iOS only lets sound start from the end of a tap; a silent blip on every tap keeps the audio unlocked
  const unlock = () => { const a = audio(); if (!a) return; try { const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource(); src.buffer = b; src.connect(a.destination); src.start(0); } catch {} };
  for (const ev of ['touchend', 'pointerup', 'click']) addEventListener(ev, unlock, { passive: true, capture: true });
  function tone(freq, dur = 0.14, type = 'triangle', vol = 0.15, when = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const note = k => 392 * Math.pow(2, SCALE[Math.max(0, Math.min(k, SCALE.length - 1))] / 12);
  // in the store app the phone's own haptics are used (they also work on iPhone); in a browser, vibrate where supported
  const buzz = p => {
    if (!vibOn) return;
    const hp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    try {
      if (hp) { if (Array.isArray(p)) hp.notification({ type: 'WARNING' }); else hp.impact({ style: p >= 20 ? 'MEDIUM' : 'LIGHT' }); return; }
      navigator.vibrate && navigator.vibrate(p);
    } catch {}
  };

  // drawing helpers
  const hex = c => { const n = parseInt(c.slice(1, 7), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  // mix a colour toward white (amt > 0) or toward a deep ink (amt < 0)
  const shade = (c, amt) => { const [r, g, b] = hex(c), t = amt > 0 ? [255, 255, 255] : [40, 30, 60], k = Math.abs(amt); return `rgb(${Math.round(r + (t[0] - r) * k)},${Math.round(g + (t[1] - g) * k)},${Math.round(b + (t[2] - b) * k)})`; };
  // a raised rounded block: soft shadow, darker side, lit face, a little gloss
  function block(x, y, w, color, r = w * 0.24, c = ctx) {

        let k = y - 1; while (k >= 0 && b[k][x] == null) k--;
        if (k >= 0 && !isFixed(b[k][x])) { b[y][x] = b[k][x]; b[k][x] = null; }
      }
    }
  },
  combo: wave => [1, 1.5, 2, 3, 4, 5][Math.min(wave, 5)],
};

// ---------- shared animation engine: sprites + a queue of timed phases ----------
const EASE = {
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t,
  lin: t => t,
  back: t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2),
  bounce: t => { const n = 7.5625, d = 2.75; return t < 1 / d ? n * t * t : t < 2 / d ? n * (t - 1.5 / d) ** 2 + 0.75 : t < 2.5 / d ? n * (t - 2.25 / d) ** 2 + 0.9375 : n * (t - 2.625 / d) ** 2 + 0.984375; },
};
const Anim = {
  // call in a game's start(): gives it sprites (o.sp), a phase queue and an input queue
  setup(o) { o.nid = 1; o.sp = new Map(); o.phases = []; o.ph = null; o.queued = null; },
  // a logic tile {id, v} with a sprite {x, y, sc, a, ...}
  tile(o, v, x, y, extra) { const t = { id: o.nid++, v }; o.sp.set(t.id, { v, x, y, sc: 1, a: 1, ...extra }); return t; },
  s(o, t) { return t && o.sp.get(t.id); },
  // fn runs when the phase starts and returns tweens: [[sprite, {prop: target}], ...]
  phase(o, dur, fn, ease = 'out') { o.phases.push({ dur, fn, ease }); },
  busy(o) { return !!(o.ph || o.phases.length); },
  // run fn now, or after the current animation if one is playing
  input(o, fn) { if (Anim.busy(o)) { o.queued = fn; return; } fn(); },
  step(o, now) {
    for (let guard = 0; guard < 50; guard++) {
      if (!o.ph) {
        const nx = o.phases.shift();
        if (!nx) { if (o.queued && !LAB.api.ended) { const f = o.queued; o.queued = null; f(); continue; } return; }
        const tw = (nx.fn ? nx.fn() || [] : []).filter(([sp]) => sp).map(([sp, to]) => ({ sp, to, from: Object.fromEntries(Object.keys(to).map(k => [k, sp[k] ?? 0])) }));
        o.ph = { ...nx, tw, t0: now, dur: LAB.api.reduce ? Math.min(nx.dur, 40) : nx.dur };
      }
      const ph = o.ph, t = ph.dur <= 0 ? 1 : Math.min(1, (now - ph.t0) / ph.dur), e = EASE[ph.ease](t);
      for (const { sp, from, to } of ph.tw) for (const k in to) sp[k] = from[k] + (to[k] - from[k]) * e;
      if (t < 1) return;
      for (const { sp, to } of ph.tw) Object.assign(sp, to);
      o.ph = null;
    }
  },
  // standard "light up then pop" for a list of [tile, px, py, color]
  pop(o, api, items, onPop) {
    Anim.phase(o, 120, () => items.map(([t]) => [Anim.s(o, t), { sc: 1.25 }]));
    Anim.phase(o, 170, () => {
      items.forEach(([, x, y, c]) => api.burst(x, y, c, 9));
      onPop && onPop();
      return items.map(([t]) => [Anim.s(o, t), { sc: 1.7, a: 0 }]);
    });
    Anim.phase(o, 0, () => { items.forEach(([t]) => o.sp.delete(t.id)); return []; });
  },
};
// drop tiles down in every column of b (tiles or null); newV() makes refills (or pass null for no refill).
// Logic changes now; returns a function for a phase that creates the new sprites above the board and returns the tweens.
Anim.fall = (o, b, newV) => {
  const R = b.length, C = b[0].length, moves = [], spawns = [];
  for (let x = 0; x < C; x++) {
    let y = R - 1;
    for (let yy = R - 1; yy >= 0; yy--) { const t = b[yy][x]; if (!t) continue; b[yy][x] = null; b[y][x] = t; moves.push([t, x, y]); y--; }
    const miss = y + 1;
    if (newV) for (; y >= 0; y--) { const t = { id: o.nid++, v: newV() }; b[y][x] = t; spawns.push([t, x, y, y - miss]); }
  }
  return () => {
    spawns.forEach(([t, x, , y0]) => o.sp.set(t.id, { v: t.v, x, y: y0, sc: 1, a: 1 }));
    return [...moves.map(([t, x, y]) => [o.sp.get(t.id), { x, y }]), ...spawns.map(([t, , y]) => [o.sp.get(t.id), { y }])];
  };
};
// clip drawing to a grid area so tiles sliding in from outside stay hidden
Anim.clip = (api, G, cols, rows, fn) => { const { ctx } = api; ctx.save(); ctx.beginPath(); ctx.roundRect(G.ox, G.oy, cols * G.cs, rows * G.cs, G.cs * 0.2); ctx.clip(); fn(); ctx.restore(); ctx.globalAlpha = 1; };
// ---------- 15. Balance Stack ----------
GAMES.push({
  id: 'balancestack', name: 'Balance Stack',
  pitch: 'Bouw hoger zonder dat de wip omslaat.',
  controls: 'Tik boven een plek om het gewicht te laten vallen',
  rules: [
    { t: 'Laat een gewicht vallen', d: 'Tik boven een van de zeven plekken op de wip. Het gewicht bovenin valt daar.' },
    { t: 'Afstand telt', d: 'Hoe verder van het midden, hoe harder het gewicht aan de wip trekt.' },
    { t: 'Gelijke gewichten smelten', d: 'Twee gelijke gewichten op elkaar worden één gewicht dat twee keer zo zwaar is.' },
    { t: 'Zoek de balans', d: 'Staat de wip precies recht, dan krijg je bonuspunten.' },
    { t: 'Pas op', d: 'Slaat de wip te ver door, of wordt een stapel te hoog, dan ben je af.' },
  ],
  why: 'Leuk om naar te kijken, maar natuurkunde maakt het lastiger om goed af te stellen.',
  start(api) { Anim.setup(this); this.st = Array.from({ length: 7 }, () => []); this.slot = 3; this.limit = 16; this.shownT = 0; this.ang = 0; this.next(api); this.hud(api); },
  next(api) { const r = api.rand(); this.cur = r < 0.55 ? 1 : r < 0.9 ? 2 : 3; this.ct0 = performance.now(); },
  torque() { return this.st.reduce((a, s, i) => a + (i - 3) * s.reduce((x, t) => x + Math.pow(2, t.v - 1), 0), 0); },
  hud(api) { const t = this.torque(); api.info(`Kanteling ${t > 0 ? '→' : t < 0 ? '←' : '•'} ${Math.abs(t)}/${this.limit}`); },
  slotAt(p) { return Math.max(0, Math.min(6, Math.floor((p.x / LAB.api.W - 0.08) / 0.84 * 7))); },
  hover(p) { this.slot = this.slotAt(p); }, down(p) { this.slot = this.slotAt(p); }, move(p) { this.slot = this.slotAt(p); },
  up(p, m, cancel) { if (cancel) return; this.slot = this.slotAt(p); const s = this.slot; Anim.input(this, () => this.drop(s)); },
  key(k) { if (k === 'ArrowLeft') { this.slot = Math.max(0, this.slot - 1); return true; } if (k === 'ArrowRight') { this.slot = Math.min(6, this.slot + 1); return true; } if (k === 'ArrowDown' || k === ' ' || k === 'Enter') { const s = this.slot; Anim.input(this, () => this.drop(s)); return true; } return false; },
  drop(slot) {
    const api = LAB.api, s = this.st[slot];
    // 1) the weight falls from the top and bounces onto its stack
    const t = Anim.tile(this, this.cur, 0, 0, { i: slot, h: s.length, f: 0, l: this.cur }); s.push(t);
    Anim.phase(this, 260 + (6 - s.length) * 25, () => [[Anim.s(this, t), { f: 1 }]], 'bounce');
    Anim.phase(this, 0, () => api.tone(200, 0.06, 'sine', 0.06));
    // 2) equal weights melt together: the top one sinks into the one below, which grows
    let merges = 0;
    while (s.length >= 2 && s[s.length - 1].v === s[s.length - 2].v) {
      const top = s.pop(), below = s[s.length - 1]; below.v++; merges++;
      const m = merges, nv = below.v, hb = s.length - 1;
      Anim.phase(this, 150, () => [[Anim.s(this, top), { h: hb, sc: 0.6 }]], 'in');
      Anim.phase(this, 140, () => {
        this.sp.delete(top.id); const b = Anim.s(this, below); b.l = nv;
        const [x, y] = this.slotXY(slot, hb); api.burst(x, y, api.COLORS[nv % 6], 12); api.tone(api.note(nv + m), 0.16, 'triangle', 0.14);
        return [[b, { sc: 1.4 }]];
      });
      Anim.phase(this, 220, () => [[Anim.s(this, below), { sc: 1 }]], 'bounce');
    }
    const last = s[s.length - 1].v, tq = this.torque(), h = s.length;
    Anim.phase(this, 0, () => {
      // the seesaw only tilts once the weight has landed
      this.shownT = tq;
      const [x, y] = this.slotXY(slot, h - 1);
      if (merges) { api.add(10 * Math.pow(2, last) * merges, x, y); api.buzz(10); }
      if (tq === 0 && this.st.some(q => q.length)) { api.add(25, api.W / 2, api.W * 0.62); api.banner('Perfect in balans!'); }
      this.hud(api); this.next(api);
      if (Math.abs(tq) > this.limit) { api.shake(14); return api.over('De wip sloeg om.'); }
      if (h > 6) return api.over('Een stapel werd te hoog.');
    });
  },
  slotXY(i, h) {
    const W = LAB.api.W, a = this.ang || 0, cx = W / 2, cy = W * 0.72, dx = (0.08 + (i + 0.5) * 0.84 / 7) * W - cx, up = W * 0.03 + (h + 0.5) * W * 0.085;
    return [cx + dx * Math.cos(a) + up * Math.sin(a), cy + dx * Math.sin(a) - up * Math.cos(a)];
  },
  draw(api, now, dt) {
    Anim.step(this, now);
    const { ctx, W } = api, target = Math.max(-1.3, Math.min(1.3, this.shownT / this.limit)) * 0.3;
    this.ang = (this.ang || 0) + (target - (this.ang || 0)) * Math.min(1, dt / 160);
    const cx = W / 2, cy = W * 0.72;
    this.base(ctx, cx, cy, W, api.accent);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(this.ang);
    const hot = Math.abs(target) > 0.22, pw = W * 0.86, ph = W * 0.03, px = -pw / 2, py = -W * 0.012;
    ctx.fillStyle = 'rgba(70,50,30,.14)'; ctx.beginPath(); ctx.roundRect(px + 4, py + ph * 0.9, pw - 8, ph, ph / 2); ctx.fill();
    ctx.fillStyle = hot ? '#c4443a' : '#d9cfc0'; ctx.beginPath(); ctx.roundRect(px, py + ph * 0.35, pw, ph, ph / 2); ctx.fill();
    ctx.fillStyle = hot ? '#ef5b4c' : '#fff'; ctx.beginPath(); ctx.roundRect(px, py, pw, ph, ph / 2); ctx.fill();
    for (let i = 0; i < 7; i++) { ctx.fillStyle = hot ? 'rgba(255,255,255,.7)' : '#cfc5d6'; ctx.beginPath(); ctx.arc((0.08 + (i + 0.5) * 0.84 / 7) * W - cx, py + ph / 2, Math.max(2, W * 0.006), 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    for (const sp of this.sp.values()) {
      const [tx, ty] = this.slotXY(sp.i, sp.h), sx = (0.08 + (sp.i + 0.5) * 0.84 / 7) * W, sy = W * 0.1;
      this.ball(api, sx + (tx - sx) * sp.f, sy + (ty - sy) * sp.f, sp.l, sp.sc);
    }
    if (!api.ended && !Anim.busy(this)) {
      const x = (0.08 + (this.slot + 0.5) * 0.84 / 7) * W;
      ctx.strokeStyle = 'rgba(43,37,64,.18)'; ctx.lineCap = 'round'; ctx.setLineDash([2, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, W * 0.16); ctx.lineTo(x, W * 0.62); ctx.stroke(); ctx.setLineDash([]);
      this.ball(api, x, W * 0.1, this.cur, EASE.back(Math.max(0, Math.min(1, (now - (this.ct0 || 0)) / 260))));
    }
  },
  ball(api, x, y, l, sc = 1, c = api.ctx, rr) {
    const r = rr || api.W * (0.03 + l * 0.004) * sc;
    if (r <= 0.5) return;
    api.ball(x, y, r, api.COLORS[l % 6], c);
    const n = String(Math.pow(2, l - 1));
    c.font = `700 ${Math.round(r * (n.length > 2 ? 0.72 : 0.92))}px Fredoka, Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(40,30,60,.28)'; c.fillText(n, x, y + r * 0.1);
    c.fillStyle = '#fff'; c.fillText(n, x, y + r * 0.02);
  },
  // the stand under the seesaw: a two-tone wedge in the accent colour
  base(c, cx, cy, W, acc) {
    const top = cy + W * 0.01, bot = cy + W * 0.12, hw = W * 0.065;
    c.fillStyle = 'rgba(70,50,30,.14)'; c.beginPath(); c.ellipse(cx, bot + W * 0.008, hw * 1.5, W * 0.014, 0, 0, Math.PI * 2); c.fill();
    c.lineJoin = 'round'; c.lineWidth = W * 0.012;
    c.fillStyle = c.strokeStyle = acc; c.beginPath(); c.moveTo(cx, top); c.lineTo(cx - hw, bot); c.lineTo(cx, bot); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = c.strokeStyle = LAB.api.shade(acc, -0.25); c.beginPath(); c.moveTo(cx, top); c.lineTo(cx + hw, bot); c.lineTo(cx, bot); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx, top + W * 0.012, W * 0.008, 0, Math.PI * 2); c.fill();
  },
});


// ---------- app extras: first-play tutorial and the logo ----------
Object.assign(GAMES[GAMES.length - 1], {
  // first game: the first few weights come in an easy order (light ones that pair up well)
  friendly() { this.easy = [1, 1, 2, 1, 1, 2, 2, 1]; },
  tutorial(api) {
    // one weight already in the middle, and the same weight ready to drop on it
    this.st[3] = [Anim.tile(this, 1, 0, 0, { i: 3, h: 0, f: 1, l: 1 })];
    this.cur = 1; this.slot = 3;
    const hint = (api, now) => {
      const { ctx, W } = api, x = (0.08 + 3.5 * 0.84 / 7) * W, b = Math.sin(now / 200) * W * 0.012, y = W * 0.2 + b;
      ctx.globalAlpha = 0.14 + 0.08 * Math.sin(now / 200); api.rr(x - W * 0.06, W * 0.04, W * 0.12, W * 0.62, W * 0.04, api.accent); ctx.globalAlpha = 1;
      ctx.fillStyle = '#f2a01c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = W * 0.008; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(x, y + W * 0.05); ctx.lineTo(x - W * 0.035, y); ctx.lineTo(x + W * 0.035, y); ctx.closePath(); ctx.stroke(); ctx.fill();
    };
    return [
      { text: 'Tik boven het midden.', hint, done: () => this.st.flat().length !== 1 || this.st[3].length !== 1 || this.st[3][0].v !== 1 },
      { text: 'Gelijke gewichten smelten samen.', wait: 4200 },
      { text: 'Ver van het midden trekt harder. Houd de wip in balans!', wait: 4500 },
    ];
  },
  drawLogo(c, now, api) {
    const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#fbf8f3'); g.addColorStop(1, '#efe6d8');
    c.fillStyle = g; c.fillRect(0, 0, 512, 512);
    const a = Math.sin(now / 900) * 0.06;
    this.base(c, 256, 330, 512, '#8b5cf6');
    c.save(); c.translate(256, 340); c.rotate(a);
    c.fillStyle = '#d9cfc0'; c.beginPath(); c.roundRect(-200, -6, 400, 22, 11); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(-200, -14, 400, 22, 11); c.fill();
    const b = (x, h, l, r) => this.ball(api, x, -14 - r - h, l, 1, c, r);
    b(-140, 0, 2, 40); b(-140, 80, 1, 34);
    b(30, 0, 3, 46); b(30, 92, 2, 40); b(30, 172, 1, 34);
    b(150, 0, 1, 34);
    c.restore();
  },
});

// the easy order is used up before the normal random weights come back
{
  const g = GAMES[GAMES.length - 1], start0 = g.start, next0 = g.next;
  g.start = function (api) { this.easy = null; start0.call(this, api); };
  g.next = function (api) { if (this.easy && this.easy.length) { this.cur = this.easy.shift(); this.ct0 = performance.now(); return; } next0.call(this, api); };
}
LAB.boot({ key: 'balanceapp', name: 'Balance Stack', pitch: 'Laat gewichten vallen, smelt ze samen en houd de wip in balans.' });
</script>
