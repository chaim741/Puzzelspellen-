<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SeamShift</title>
<meta name="theme-color" content="#0b0d1a">
<link rel="stylesheet" href="fonts.css">
<style>
/* App shell: a home screen, a play screen and a settings sheet. One game per app; the screens fill the phone without page scroll. */
:root {
  color-scheme: dark;
  --ink: #0b0d1a; --deep: #141833; --cell: #1c2142; --line: #2a3060;
  --day: #fff4e0; --night: #7f8cff; --text: #eef0ff; --muted: #9aa0c8; --gold: #ffc93c; --danger: #ff6b57; --accent: #48b8ff;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #1a1f45 0%, var(--ink) 62%) fixed, var(--ink);
  color: var(--text); font-family: var(--body); overscroll-behavior: none; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--st) + 14px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--sb) + 16px) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .25s ease, transform .25s ease;
}
.screen[hidden] { display: flex; opacity: 0; pointer-events: none; transform: scale(.98); }
.col { width: min(100%, 460px); display: flex; flex-direction: column; }
button {
  font: 700 15px var(--body); color: var(--text); background: var(--deep); border: 1px solid var(--line);
  border-radius: 999px; padding: 12px 18px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
}
button:active { transform: scale(.97); }
button:focus-visible { outline: 2px solid var(--day); outline-offset: 2px; }
.go { background: var(--day); color: var(--ink); border: 0; font-family: var(--display); font-weight: 700; font-size: 17px; padding: 16px 26px; }
.alt { background: color-mix(in srgb, var(--accent) 18%, var(--deep)); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 20px; flex: none; }

/* home */
#home .col { flex: 1; justify-content: space-between; gap: 18px; }
.home-top { display: flex; justify-content: flex-end; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
#logo { width: min(46vw, 190px); aspect-ratio: 1; border-radius: 22%; box-shadow: 0 18px 50px -10px color-mix(in srgb, var(--accent) 45%, transparent); }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 10vw, 44px); letter-spacing: -0.03em; margin: 0; line-height: 1; }
.hero p { margin: 0; color: var(--muted); font-size: 15px; max-width: 30ch; line-height: 1.4; }
.menu { display: grid; gap: 10px; }
.menu button { width: 100%; }
.daily { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.daily small { font: 600 13px var(--body); color: var(--muted); }
.records { display: flex; gap: 10px; justify-content: center; }
.rec { flex: 1; background: var(--deep); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; text-align: center; }
.rec span { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rec b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }

/* play */
#play .col { flex: 1; gap: 10px; align-items: stretch; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .mode { flex: 1; min-width: 0; font: 700 13px var(--body); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .mode b { color: var(--accent); }
.stats { display: flex; gap: 6px; }
.stat { background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 5px 10px; min-width: 64px; text-align: right; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.info { min-height: 20px; text-align: center; color: var(--gold); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.well { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.stage { position: relative; width: min(100%, 460px); aspect-ratio: 1; touch-action: none; }
.stage.fit { width: auto; height: 100%; max-width: 100%; }
canvas { width: 100%; height: 100%; display: block; border-radius: 22px; }
.coach {
  pointer-events: none;
  background: color-mix(in srgb, var(--ink) 88%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 60%, var(--line));
  border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center;
  transition: opacity .3s ease, transform .3s ease;
}
.coach[hidden] { display: none; }
.overlay {
  position: absolute; inset: 0; z-index: 3; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 22px;
  background: color-mix(in srgb, var(--ink) 86%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.overlay[hidden] { display: none; }
.overlay h2 { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 6vw, 28px); margin: 0; }
.overlay .big { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 14vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 30ch; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.new { color: var(--gold); }
.foot { display: flex; justify-content: space-between; gap: 8px; }
.foot .ctl { align-self: center; font-size: 13px; color: var(--muted); text-align: center; flex: 1; }

/* settings sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: #0008; display: flex; align-items: flex-end; justify-content: center; transition: opacity .2s ease; }
.sheet-bg[hidden] { display: flex; opacity: 0; pointer-events: none; }
.sheet {
  width: min(100%, 480px); max-height: 86dvh; overflow: auto; background: var(--deep); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; padding: 18px 18px calc(var(--sb) + 18px); display: grid; gap: 14px;
  transition: transform .25s ease; -webkit-user-select: text; user-select: text;
}
.sheet-bg[hidden] .sheet { transform: translateY(30px); }
.sheet h3 { font-family: var(--display); font-size: 18px; margin: 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-weight: 600; font-size: 16px; }
.switch { width: 52px; height: 30px; padding: 0; border-radius: 999px; position: relative; background: var(--line); border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--day); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; line-height: 1.45; }
.sheet .small { font-size: 12px; color: var(--muted); margin: 0; }
.daily-res { text-align: center; }
.daily-res .small { font-size: 14px; }
.ds-score { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
button:disabled { opacity: .45; }
[hidden]#restartBtn { display: none; }
@media (prefers-reduced-motion: reduce) { .screen, .sheet, .coach, .sheet-bg { transition: none; } }
</style>
</head>
<body>


<section class="screen" id="home">
  <div class="col">
    <div class="home-top"><button class="icon-btn" id="setBtn1" aria-label="Instellingen">⚙︎</button></div>
    <div class="hero">
      <canvas id="logo" aria-hidden="true"></canvas>
      <h1 id="appName">SeamShift</h1>
      <p id="appPitch"></p>
    </div>
    <div class="menu">
      <div class="records">
        <div class="rec"><span>Record</span><b id="homeBest">0</b></div>
        <div class="rec"><span>Dagpuzzel</span><b id="homeDaily">–</b></div>
      </div>
      <button class="go" id="playBtn">Spelen</button>
      <button class="alt daily" id="dailyBtn"><span>Dagpuzzel</span><small id="dailyDate"></small></button>
    </div>
  </div>
</section>

<section class="screen" id="play" hidden>
  <div class="col">
    <div class="bar">
      <button class="icon-btn" id="homeBtn" aria-label="Naar start">←</button>
      <div class="mode" id="mode"></div>
      <div class="stats">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Record</span><b id="best">0</b></div>
      </div>
    </div>
    <div class="info" id="info"></div>
    <div class="coach" id="coach" hidden></div>
    <div class="well" id="well">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Speelveld"></canvas>
        <div class="overlay" id="over" hidden>
          <h2 id="overTitle">Einde</h2>
          <div class="big" id="finalScore">0</div>
          <p id="overText"></p>
          <div class="row"><button class="go" id="againBtn">Nog een keer</button><button id="toHomeBtn">Naar start</button></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button id="restartBtn">Opnieuw</button>
      <span class="ctl" id="ctl"></span>
      <button class="icon-btn" id="setBtn2" aria-label="Instellingen">⚙︎</button>
    </div>
  </div>
</section>

<div class="sheet-bg" id="dailySheet" hidden>
  <div class="sheet daily-res" role="dialog" aria-modal="true" aria-labelledby="dsTitle">
    <div class="sheet-head"><h3 id="dsTitle">Dagpuzzel</h3><button class="icon-btn" id="dsClose" aria-label="Sluiten">✕</button></div>
    <p class="small">Je hebt de dagpuzzel van vandaag gespeeld. Je score:</p>
    <div class="ds-score" id="dsScore">0</div>
    <p class="small" id="dsNext"></p>
    <button class="go" id="dsShare">Deel je score</button>
  </div>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-head"><h3 id="setTitle">Instellingen</h3><button class="icon-btn" id="closeSet" aria-label="Sluiten">✕</button></div>
    <div class="toggle"><span>Geluid</span><button class="switch" id="sndSw" role="switch" aria-checked="true" aria-label="Geluid"></button></div>
    <div class="toggle"><span>Trillen</span><button class="switch" id="vibSw" role="switch" aria-checked="true" aria-label="Trillen"></button></div>
    <button id="tutBtn">Uitleg opnieuw spelen</button>
    <h3>Spelregels</h3>
    <ol id="rules"></ol>
    <p class="small">Je scores worden alleen op dit toestel bewaard.</p>
  </div>
</div>
<script>
// ---------- App framework: one game, home / play / settings, daily puzzle, first-play tutorial ----------
const GAMES = [];
const LAB = (() => {
  const COLORS = ['#ff6b57', '#ffc93c', '#2fe0a0', '#48b8ff', '#c58cff', '#ff8fc7'];
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), well = $('well');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let P = 'app';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(P + '_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(P + '_' + k, JSON.stringify(v)); } catch {} },
  };
  let W = 0, dpr = 1, cur = null, fx = [], shakeAmt = 0, score = 0, ended = false, playing = false;
  let soundOn = true, vibOn = true, daily = false, tut = null;

  // the board is the largest square that fits the space between the top bar and the buttons
  function resize() {
    const r = well.getBoundingClientRect(), s = Math.max(200, Math.floor(Math.min(r.width, r.height, 460)));
    stage.style.width = s + 'px'; stage.style.height = s + 'px';
    dpr = Math.min(devicePixelRatio || 1, 3); W = s; cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr);
  }
  new ResizeObserver(resize).observe(well);

  // seeded randomness so everyone gets the same daily puzzle
  let rng = Math.random;
  const seeded = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

  // sound
  let ac = null;
  function audio() { if (!soundOn) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch { ac = null; } return ac; }
  function tone(freq, dur = 0.14, type = 'triangle', vol = 0.15, when = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const note = k => 392 * Math.pow(2, SCALE[Math.max(0, Math.min(k, SCALE.length - 1))] / 12);
  // in the store app the phone's own haptics are used (they also work on iPhone); in a browser, vibrate where supported
  const buzz = p => {
    if (!vibOn) return;
    const hp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    try {
      if (hp) { if (Array.isArray(p)) hp.notification({ type: 'WARNING' }); else hp.impact({ style: p >= 20 ? 'MEDIUM' : 'LIGHT' }); return; }
      navigator.vibrate && navigator.vibrate(p);
    } catch {}
  };

  // drawing helpers
  function shape(s, x, y, r, mode = 'fill', color) {
    const c = color || COLORS[s % COLORS.length];
    ctx.beginPath();
    const k = s % 6;
    if (k === 0) ctx.arc(x, y, r, 0, Math.PI * 2);
    else if (k === 1) { const h = r * 1.15; ctx.moveTo(x, y - h); ctx.lineTo(x + h * 0.95, y + h * 0.62); ctx.lineTo(x - h * 0.95, y + h * 0.62); ctx.closePath(); }
    else if (k === 2) ctx.roundRect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76, r * 0.3);
    else if (k === 3) { const h = r * 1.2; ctx.moveTo(x, y - h); ctx.lineTo(x + h, y); ctx.lineTo(x, y + h); ctx.lineTo(x - h, y); ctx.closePath(); }
    else if (k === 4) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r * 1.15; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
    else { for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r * 1.05, y + Math.sin(a) * r * 1.05); } ctx.closePath(); }
    if (mode === 'fill') {
      ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.16); ctx.strokeStyle = '#fff4e0'; ctx.lineJoin = 'round'; ctx.stroke();
    } else { ctx.lineWidth = Math.max(2, r * 0.32); ctx.strokeStyle = c; ctx.lineJoin = 'round'; ctx.stroke(); }
  }
  function rr(x, y, w, h, r, fill, stroke, lw = 1) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  // grid fitted into the square board
  function grid(cols, rows, padF = 0.035) {
    const pad = W * padF, cs = (W - 2 * pad) / Math.max(cols, rows);
    const ox = (W - cs * cols) / 2, oy = (W - cs * rows) / 2;
    return {
      cols, rows, cs, ox, oy,
      x: c => ox + (c + 0.5) * cs, y: r => oy + (r + 0.5) * cs,
      cell(px, py) { const c = Math.floor((px - ox) / cs), r = Math.floor((py - oy) / cs); return c >= 0 && r >= 0 && c < cols && r < rows ? { c, r } : null; },
      cellF(px, py) { return { c: (px - ox) / cs, r: (py - oy) / cs }; },
      bg(danger) {
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
          rr(ox + c * cs + cs * 0.05, oy + r * cs + cs * 0.05, cs * 0.9, cs * 0.9, cs * 0.16, danger ? '#2a1e3a' : '#1c2142');
      },
    };
  }

  // effects (pixel coordinates in board space)
  function burst(x, y, color, n = 12, power = 1) {
    fx.push({ k: 'ring', x, y, c: color, life: 0, max: 420, r: W * 0.05 * power });
    const parts = reduce ? 4 : n;
    for (let i = 0; i < parts; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.5 + Math.random() * 1.6) * W * 0.004 * power;
      fx.push({ k: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: color, life: 0, max: 400 + Math.random() * 300 });
    }
  }
  const float = (text, x, y, size = 1) => fx.push({ k: 'text', text, x, y, size, life: 0, max: 900 });
  const banner = text => fx.push({ k: 'banner', text, life: 0, max: 1200 });
  const shake = a => { shakeAmt = Math.max(shakeAmt, a); };


  const fmt = n => n.toLocaleString('nl-NL');
  const bestKey = () => daily ? 'daily_' + today() : 'best';
  function hud() {
    $('score').textContent = fmt(score);
    $('best').textContent = fmt(Math.max(store.get(bestKey(), 0), score));
  }
  const api = {
    get W() { return W; }, ctx, COLORS, shape, rr, grid, burst, float, banner, shake, tone, note, buzz, reduce,
    get score() { return score; },
    add(n, x, y, size) { if (!n) return; score += Math.round(n); hud(); if (x != null) float('+' + Math.round(n), x, y, size); },
    info(t) { $('info').textContent = t || ''; },
    over(reason) {
      if (ended) return; ended = true;
      const prev = store.get(bestKey(), 0), isBest = score > prev;
      if (isBest) store.set(bestKey(), score);
      if (!daily) store.set('games', store.get('games', 0) + 1);
      const close = !daily && !isBest && prev > 0 && score >= prev * 0.8;
      tone(330, 0.25, 'sine', 0.14); tone(220, 0.45, 'sine', 0.14, 0.18); buzz([30, 60, 30]);
      setTimeout(() => {
        if (!ended || !playing) return;
        coach(null);
        $('overTitle').textContent = daily ? 'Dagpuzzel klaar' : isBest && score > 0 ? 'Nieuw record!' : close ? 'Bijna!' : 'Einde';
        $('overTitle').classList.toggle('new', (isBest && score > 0) || close);
        $('finalScore').textContent = fmt(score);
        // how far from the record: the "almost" feeling that makes you try again
        const gap = !daily && !isBest && prev > 0 ? ` Nog ${fmt(prev - score + 1)} punten tot je record.` : '';
        $('overText').textContent = (reason || '') + gap + (daily ? ' Morgen staat er een nieuwe dagpuzzel klaar.' : '');
        $('againBtn').textContent = daily ? 'Deel je score' : 'Nog een keer';
        // the buttons wait a moment so a last tap in the game doesn't press them by accident
        const bs = [$('againBtn'), $('toHomeBtn')]; bs.forEach(b => b.disabled = true);
        setTimeout(() => { bs.forEach(b => b.disabled = false); $('againBtn').focus({ preventScroll: true }); }, 650);
        $('over').hidden = false;
      }, 600);
    },
    get ended() { return ended; },
    get daily() { return daily; },
    rand: () => rng(),
    rnd: n => Math.floor(rng() * n),
  };

  // first-play tutorial: the game gives steps {text, hint(api, now), done(), wait}
  function coach(text) { const c = $('coach'); if (text) c.textContent = text; c.hidden = !text; }
  function tutStep() {
    if (!tut) return;
    const st = tut.steps[tut.i];
    if (!st) { tut = null; coach(null); store.set('tutDone', true); return; }
    if (tut.shown !== tut.i) { tut.shown = tut.i; tut.t0 = performance.now(); coach(st.text); }
    if (st.done ? st.done() : performance.now() - tut.t0 > (st.wait || 4000)) { tut.i++; }
  }

  function start(withTut) {
    score = 0; ended = false; fx = []; shakeAmt = 0;
    $('over').hidden = true; api.info(''); coach(null);
    rng = daily ? seeded(hash(today() + cur.id)) : Math.random;
    $('mode').innerHTML = daily ? `<b>Dagpuzzel</b> · ${new Date().toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' })}` : '';
    cur.start(api);
    // the very first game starts on a friendlier board (same rules)
    if (!daily && store.get('games', 0) === 0 && cur.friendly) cur.friendly(api);
    $('restartBtn').hidden = daily;
    if (daily) store.set(bestKey(), store.get(bestKey(), 0));
    tut = withTut && cur.tutorial ? { steps: cur.tutorial(api), i: 0, shown: -1 } : null;
    hud();
  }
  function show(id) {
    // leaving the daily puzzle halfway still uses up today's try
    if (id === 'home' && playing && daily && !ended) store.set(bestKey(), Math.max(store.get(bestKey(), 0), score));
    for (const s of ['home', 'play']) $(s).hidden = s !== id;
    playing = id === 'play';

  make(c, r, f) { return Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => f(x, y))); },
  // groups of equal values (4-neighbour), returns array of [ [x,y],... ]
  groups(b, minSize, same = (a, c) => a != null && a === c) {
    const R = b.length, C = b[0].length, seen = H.make(C, R, () => false), out = [];

      const v = b[y][x], st = [[x, y]], g = []; seen[y][x] = true;
      while (st.length) {
        const [cx, cy] = st.pop(); g.push([cx, cy]);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy;

    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {

  },
  tutorial(api) {
    // make sure a swipe along the middle line gives two pairs
    const paint = (x, y, v) => { const t = this.b[y][x]; t.v = v; this.sp.get(t.id).v = v; };
    const a = this.b[1][2].v, c = (a + 1) % this.n;
    paint(3, 1, a); paint(2, 4, c); paint(3, 4, c);
    for (const y of [0, 2, 3, 5]) if (this.b[y][2].v === this.b[y][3].v) paint(3, y, (this.b[y][2].v + 2) % this.n);
    const hint = (api, now) => {
      const G = api.grid(6, 6), cs = G.cs, { ctx } = api, k = (now % 1400) / 1400, x = G.ox + 3 * cs;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now / 180); ctx.strokeStyle = '#fff4e0'; ctx.lineWidth = cs * 0.08; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, G.oy + cs * 0.2); ctx.lineTo(x, G.oy + 6 * cs - cs * 0.2); ctx.stroke(); ctx.lineCap = 'butt';
      for (const y of [1, 4]) api.rr(G.ox + 2 * cs + 3, G.oy + y * cs + 3, 2 * cs - 6, cs - 6, cs * 0.2, null, '#ffc93c', 3);
      const fy = G.oy + cs * (1 + 4 * EASEIO(Math.min(1, k * 1.4)));
      ctx.globalAlpha = k > 0.85 ? (1 - k) / 0.15 : 1;
      ctx.beginPath(); ctx.arc(x, fy, cs * 0.28, 0, Math.PI * 2); ctx.fillStyle = '#fff4e0aa'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff4e0'; ctx.stroke();
      ctx.globalAlpha = 1;
    };
    return [
      { text: 'Swipe omlaag langs de lichtende lijn.', hint, done: () => api.score > 0 },
      { text: 'Gelijke tegels botsen en knallen weg.', wait: 4500 },
      { text: 'Kies nu zelf een naad. Succes!', wait: 4000 },
    ];
  },
  drawLogo(c, now) {
    const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#232a63'); g.addColorStop(1, '#0d1028');
    c.fillStyle = g; c.fillRect(0, 0, 512, 512);
    const cols = ['#ff6b57', '#ffc93c', '#2fe0a0', '#48b8ff'], cs = 92, gap = 14 + 10 * (0.5 + 0.5 * Math.sin(now / 700));
    const grid = [[0, 2, 1, 3], [3, 1, 1, 0], [2, 0, 3, 2], [1, 3, 0, 1]];
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const side = x < 2 ? -1 : 1, px = 256 + (x - 2) * cs + side * gap / 2 + (side < 0 ? 0 : 0), py = 256 + (y - 2) * cs, v = grid[y][x];
      const hot = y === 1 && (x === 1 || x === 2);
      c.beginPath(); c.roundRect(px + 7, py + 7, cs - 14, cs - 14, 20); c.fillStyle = cols[v] + (hot ? '66' : '30'); c.fill();
      c.beginPath(); c.arc(px + cs / 2, py + cs / 2, 22, 0, Math.PI * 2); c.fillStyle = cols[v]; c.fill(); c.lineWidth = 5; c.strokeStyle = '#fff4e0'; c.stroke();
    }
    c.shadowColor = '#fff4e0'; c.shadowBlur = 30; c.strokeStyle = '#fff4e0'; c.lineWidth = 10; c.lineCap = 'round';
    c.beginPath(); c.moveTo(256, 80); c.lineTo(256, 432); c.stroke(); c.shadowBlur = 0; c.lineCap = 'butt';
  },
});
const EASEIO = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
LAB.boot({ key: 'seamapp', name: 'SeamShift', pitch: 'Kies een naad, laat het bord samenknijpen en laat gelijke tegels knallen.' });
</script>
